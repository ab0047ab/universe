<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Creative Grave</title>

    <meta name="robots" content="index, follow, noarchive, nosnippet, noimageindex">

    <link rel="stylesheet"
          href="./css/style.css">

    <!--
        import map 必须写在 es-module-shims 脚本【之前】。
        指向自托管的本地文件，不再依赖任何第三方 CDN
        （jsdelivr / jspm 在部分网络环境下不稳定，之前排查过）。
        "three/addons/" 这条映射不需要了，因为 loader.js /
        postprocessing.js 里对 GLTFLoader、EffectComposer 等的
        引用已经改成了本地相对路径（"./GLTFLoader.js" 这种）。
    -->
    <script type="importmap">
    {
      "imports": {
        "three": "./js/three.module.js"
      }
    }
    </script>

    <!--
        必须写在 importmap 之后（不能反过来）：
        这是 async 脚本，一下载完就会立刻执行初始化扫描，
        如果排在 importmap 前面，可能在浏览器还没解析到
        importmap 时就执行完了，导致它拿到空映射表，
        表现就是所有 import "three" 都报错。
    -->
    <script async src="./js/es-module-shims.js"></script>

</head>

<body>

    <!--
        type="module" 改成 type="module-shim"：
        iOS 16.0~16.3 原生支持 <script type="module">，
        但不支持 import map。用 type="module" 的话，浏览器会
        用自己的原生模块加载器抢先处理，跳过 es-module-shims，
        直接报 "Unable to resolve specifier three" 之类的错。
        改成 module-shim 后，浏览器不认识这个类型会直接忽略，
        只有 es-module-shims 会接管解析和执行，避免这个问题。
    -->
    <script type="module-shim" src="./js/main.js"></script>

</body>

</html>
